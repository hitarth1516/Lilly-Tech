name: Validate JSON and CSV Files

on:
  pull_request:
    branches:
      - main

jobs:
  validate-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Validate JSON and CSV files
        run: |
          python scripts/scripts_validate_files.py
