name: Validate JSON and CSV Files

on:
  pull_request:
    branches:
      - main

jobs:
  validate-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl pyyaml

      - name: List files for debugging
        run: |
          echo "Listing current directory contents recursively:"
          ls -R
          echo "End of directory listing."

      - name: Validate JSON and CSV files
        run: |
          python scripts/scripts_validate_files.py
        env:
          # Corrected paths to reflect the deeper nesting in the repository structure
          METRIC_CONFIG_PATH: INPUT/03_METADATA_FILES/METRIC_SEGMENT_ASSET/CONFIG_FILE/METRIC_CONFIG/Metric_Config_File.csv
          MASTER_CONFIG_PATH: INPUT/03_METADATA_FILES/METRIC_SEGMENT_ASSET/CONFIG_FILE/MASTER_CONFIG/Master_Config_File.csv
          # Updated OUTPUT_PATH to the new desired location
          OUTPUT_PATH: INPUT/DQM_REPORT/dqm_report.xlsx

      - name: Trim spaces in Metric_config_file.csv
        run: |
          python scripts/trim_spaces.py
        env:
          # Corrected path for trim_spaces.py as well
          METRIC_CONFIG_PATH: INPUT/03_METADATA_FILES/METRIC_SEGMENT_ASSET/CONFIG_FILE/METRIC_CONFIG/Metric_Config_File.csv

