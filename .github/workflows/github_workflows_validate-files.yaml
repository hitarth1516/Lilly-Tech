name: Validate JSON and CSV Files

on:
  pull_request:
    branches:
      - main

jobs:
  validate-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl pyyaml

      - name: Run Validation Script
        run: |
          python scripts/scripts_validate_files.py
        env:
          METRIC_CONFIG_PATH: INPUT/03_METADATA_FILES/METRIC_SEGMENT_ASSET/CONFIG_FILE/METRIC_CONFIG/Metric_Config_File.csv
          MASTER_CONFIG_PATH: INPUT/03_METADATA_FILES/METRIC_SEGMENT_ASSET/CONFIG_FILE/MASTER_CONFIG/Master_Config_File.csv
          OUTPUT_PATH: INPUT/DQM_REPORT/dqm_report.xlsx

      - name: Upload DQM Report
        uses: actions/upload-artifact@v4
        with:
          name: dqm-report
          path: INPUT/DQM_REPORT/dqm_report.xlsx
          retention-days: 5 # Optional: How long to keep the artifact (default is 90 days)

