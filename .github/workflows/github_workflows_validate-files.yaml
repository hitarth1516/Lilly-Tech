name: Validate JSON and CSV Files

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened] # Added types for the new job trigger

jobs:
  validate-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl pyyaml

      - name: Run Validation Script
        run: |
          # Now, scripts/scripts_validate_files.py handles the trimming internally
          python scripts/scripts_validate_files.py
        env:
          METRIC_CONFIG_PATH: INPUT/03_METADATA_FILES/METRIC_SEGMENT_ASSET/CONFIG_FILE/METRIC_CONFIG/Metric_Config_File.csv
          MASTER_CONFIG_PATH: INPUT/03_METADATA_FILES/METRIC_SEGMENT_ASSET/CONFIG_FILE/MASTER_CONFIG/Master_Config_File.csv
          OUTPUT_PATH: INPUT/DQM_REPORT/dqm_report.xlsx

      - name: Upload DQM Report
        uses: actions/upload-artifact@v4
        with:
          name: dqm-report
          path: INPUT/DQM_REPORT/dqm_report.xlsx
          retention-days: 5 # Optional: How long to keep the artifact (default is 90 days)

  summary-to-teams: # New job added
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Change Summary
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}

          echo "### PR Change Summary (File, Line, Description)\n" > change_summary.txt

          for file in $(git diff --name-only origin/${{ github.event.pull_request.base.ref }}); do
            echo -e "\n---\n**File:** $file" >> change_summary.txt

            # Get the diff for the file
            git diff -U0 origin/${{ github.event.pull_request.base.ref }} -- "$file" | \
            awk '
              /^@@/ {
                split($0, a, " ")
                split(a[3], b, ",")
                lineNum = b[1]
              }
              /^\+/ && !/^+++/{
                print "- Line: " lineNum " | Added: " substr($0, 2, 50)
                lineNum++
              }
              /^\-/ && !/^---/{
                print "- Line: " lineNum " | Removed: " substr($0, 2, 50)
              }
            ' >> change_summary.txt
          done

          echo "Generated Change Summary:"
          cat change_summary.txt

      - name: Send Summary to Teams # Uncommented for demonstration. Comment out if not desired for every run.
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          SUMMARY=$(cat change_summary.txt | head -c 15000)
          SUMMARY_ESCAPED=$(echo "$SUMMARY" | sed 's/"/\\"/g')
          PR_USER=${{ github.event.pull_request.user.login }} # Get the PR user's login

          echo "DEBUG: PR_USER is: $PR_USER" # Added for debugging

          curl -H 'Content-Type: application/json' -d "{
            \"text\": \"PR Change Summary - PR #${{ github.event.pull_request.number }} by $PR_USER\n\n$SUMMARY_ESCAPED\"
          }" $TEAMS_WEBHOOK_URL

