  summary-to-teams:
    runs-on: ubuntu-latest
    needs: validate-files

    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download DQM Report
        uses: actions/download-artifact@v4
        with:
          name: dqm-report
          path: ./dqm-report/

      - name: Debug Directory Contents
        run: |
          echo "Listing contents of ./dqm-report/:"
          ls -la ./dqm-report/
          if [ -f ./dqm-report/dqm_report.xlsx ]; then
            echo "dqm_report.xlsx found."
          else
            echo "dqm_report.xlsx NOT found."
            exit 1
          fi

      - name: Generate Change Summary
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}

          echo "### PR Change Summary (File, Line, Description)\n" > change_summary.txt

          for file in $(git diff --name-only origin/${{ github.event.pull_request.base.ref }}); do
            echo -e "\n---\n**File:** $file" >> change_summary.txt

            git diff -U0 origin/${{ github.event.pull_request.base.ref }} -- "$file" | \
            awk '
              /^@@/ {
                split($0, a, " ")
                split(a[3], b, ",")
                lineNum = b[1]
              }
              /^\+/ && !/^+++/{
                print "- Line: " lineNum " | Added: " substr($0, 2, 50)
                lineNum++
              }
              /^\-/ && !/^---/{
                print "- Line: " lineNum " | Removed: " substr($0, 2, 50)
              }
            ' >> change_summary.txt
          done

          echo "Generated Change Summary:"
          cat change_summary.txt

      - name: Convert DQM Report to Base64
        run: |
          if [ -f ./dqm-report/dqm_report.xlsx ]; then
            base64 ./dqm-report/dqm_report.xlsx > dqm_report.b64
            echo "DQM_REPORT_BASE64=$(cat dqm_report.b64)" >> $GITHUB_ENV
          else
            echo "Error: dqm_report.xlsx not found in ./dqm-report/"
            exit 1
          fi

      - name: Send Summary to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          SUMMARY=$(cat change_summary.txt | head -c 15000)
          SUMMARY_ESCAPED=$(echo "$SUMMARY" | sed 's/"/\\"/g')
          PR_USER=${{ github.actor }}

          echo "DEBUG: PR_USER is: $PR_USER"

          curl -H 'Content-Type: application/json' -d "{
            \"@type\": \"MessageCard\",
            \"@context\": \"http://schema.org/extensions\",
            \"summary\": \"PR Change Summary\",
            \"title\": \"PR Change Summary - PR #${{ github.event.pull_request.number }} by $PR_USER\",
            \"text\": \"$SUMMARY_ESCAPED\",
            \"sections\": [{
              \"activityTitle\": \"DQM Report Attachment\",
              \"facts\": [{
                \"name\": \"File:\",
                \"value\": \"dqm_report.xlsx\"
              }]
            }],
            \"potentialAction\": [{
              \"@type\": \"OpenUri\",
              \"name\": \"Download DQM Report\",
              \"targets\": [{
                \"os\": \"default\",
                \"uri\": \"data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,${{ env.DQM_REPORT_BASE64 }}\"
              }]
            }]
          }" $TEAMS_WEBHOOK_URL
